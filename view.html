  <!-- If the app hasn't called appReady() within 8 s, or a module fails to load (e.g. a cached old file right
       after an update), show a message and a Reload button that fetches the page afresh, keeping the #hash. -->
  <script>
    (() => {
      let ready = false, box = null;
      const failed = slow => {
        if (box) return;
        document.getElementById('loading')?.setAttribute('hidden', '');
        box = document.createElement('div');
        box.id = 'load-failed';
        box.setAttribute('role', 'alert');
        box.dataset.slow = slow ? '1' : '';
        box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center;font:17px/1.4 system-ui,sans-serif;background:#1b2a1f;color:#fff';
        const p = document.createElement('p');
        p.textContent = "Couldn't load the app. This can happen right after an update.";
        const b = document.createElement('button');
        b.type = 'button';
        b.id = 'load-failed-reload';
        b.textContent = 'Reload';
        b.style.cssText = 'font:inherit;font-weight:600;padding:.7rem 2rem;border:0;border-radius:8px;background:#fff;color:#1b2a1f;cursor:pointer';
        b.addEventListener('click', () => {
          const url = new URL(location.href);
          url.searchParams.set('r', Date.now());
          location.replace(url.href);
        });
        box.append(p, b);
        (document.body ?? document.documentElement).append(box);
      };
      const timer = setTimeout(() => { if (!ready) failed(true); }, 8000);
      // A script that can't be fetched fires 'error' on its element (seen here while capturing); a module
      // that can't be linked (a missing export) or throws reports an ErrorEvent.
      addEventListener('error', e => {
        if (!ready && (e instanceof ErrorEvent || e.target?.tagName === 'SCRIPT')) failed(false);
      }, true);
      addEventListener('unhandledrejection', () => { if (!ready) failed(false); });
      window.appReady = () => {
        ready = true;
        clearTimeout(timer);
        if (box?.dataset.slow) { box.remove(); box = null; }
      };
      window.appFailed = () => failed(false);
    })();
  </script>
  <script type="module" src="js/view.js?v=a5cf2def8c"></script>
  <!-- The phone viewer for share links (view.html#p=<data>, made by File > Share link… in the designer).
       Read-only: the play is in the address hash, which never reaches the server. -->
</head>
<body>
  <section class="screen message" id="loading">
    <p>Opening the play…</p>
  </section>

  <section class="screen message" id="broken" hidden>
    <h1>This link doesn't open a play</h1>
    <p id="broken-text"></p>
    <a class="big" href="./">Open the Rugby Play Designer</a>
  </section>

  <section class="screen start" id="start" hidden>
    <div class="team" id="start-team" hidden>
      <img id="start-logo" alt="" hidden>
      <span id="start-team-name"></span>
    </div>
    <h1 id="start-name"></h1>
    <p class="meta" id="start-meta"></p>
    <h2>Which position do you play?</h2>
    <div class="team-switch" id="team-switch" role="group" aria-label="Team" hidden>
      <button type="button" data-team="attack" aria-pressed="true">Attack</button>
      <button type="button" data-team="defense" aria-pressed="false">Defense</button>
    </div>
    <div class="positions" id="positions" role="group" aria-label="Positions"></div>
    <button type="button" class="big secondary" id="watch-all">Watch the whole play</button>
  </section>

  <section class="screen watch" id="watch" hidden>
    <header class="watch-head">
      <strong id="watch-phase">Phase 1 of 1</strong>
      <span id="watch-who"></span>
    </header>
    <div class="stage" id="stage">
      <svg id="pitch" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rugby pitch" preserveAspectRatio="xMidYMid meet">
        <defs id="defs"></defs>
        <g id="world" transform="rotate(-90)">
          <g id="pitch-layer"></g>
          <g id="objects-layer"></g>
          <g id="routes-layer"></g>
          <g id="players-layer"></g>
          <g id="ball-routes-layer"></g>
          <g id="labels-layer"></g>
          <g id="ball-layer"></g>
        </g>
      </svg>
      <div class="cue-bubble" id="cue-bubble" role="status" aria-live="assertive" hidden><span></span></div>
      <div class="end" id="end" hidden>
        <h2 id="end-name"></h2>
        <button type="button" class="big" id="watch-again">Watch again</button>
        <button type="button" class="big secondary" id="another">Another position</button>
        <button type="button" class="big secondary" id="share">Share</button>
        <p class="end-status" id="end-status" aria-live="polite"></p>
      </div>
    </div>
    <div class="bottom">
      <div class="job-box" id="job-box" hidden>
        <div class="job-head">
          <span class="job-label">Your job</span>
          <button type="button" class="note-button" id="note-button" aria-haspopup="dialog">Coach's note</button>
        </div>
        <p class="job" id="job" aria-live="polite"></p>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <nav class="controls" aria-label="Playback">
      <button type="button" id="home" aria-label="Positions">☰</button>
      <button type="button" id="back" aria-label="Previous phase">‹</button>
      <button type="button" id="toggle" class="play" aria-label="Pause">❚❚</button>
      <button type="button" id="next" aria-label="Next phase">›</button>
      <div class="speed" role="group" aria-label="Speed">
        <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
      </div>
    </nav>
    <dialog class="sheet" id="note-sheet" aria-labelledby="sheet-title">
      <form method="dialog">
        <p class="sheet-phase" id="sheet-phase"></p>
        <h2 class="sheet-label">Your job</h2>
        <p class="sheet-job" id="sheet-job"></p>
        <div id="sheet-note-box">
          <h2 class="sheet-label" id="sheet-title">Coach's note</h2>
          <p class="sheet-note" id="sheet-note"></p>
        </div>
        <button class="big" id="note-close">Close</button>
      </form>
    </dialog>
  </section>
</body>
</html>
