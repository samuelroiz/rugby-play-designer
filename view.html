<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a1f">
  <title>Rugby play</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="view.css">
  <script type="module" src="js/view.js"></script>
  <!-- The phone viewer for share links (view.html#p=<data>, made by File > Share link… in the designer).
       Read-only: the play is in the address hash, which never reaches the server. -->
</head>
<body>
  <section class="screen message" id="loading">
    <p>Opening the play…</p>
  </section>

  <section class="screen message" id="broken" hidden>
    <h1>This link doesn't open a play</h1>
    <p id="broken-text"></p>
    <a class="big" href="./">Open the Rugby Play Designer</a>
  </section>

  <section class="screen start" id="start" hidden>
    <div class="team" id="start-team" hidden>
      <img id="start-logo" alt="" hidden>
      <span id="start-team-name"></span>
    </div>
    <h1 id="start-name"></h1>
    <p class="meta" id="start-meta"></p>
    <h2>Which position do you play?</h2>
    <div class="positions" id="positions" role="group" aria-label="Positions"></div>
    <button type="button" class="big secondary" id="watch-all">Watch the whole play</button>
  </section>

  <section class="screen watch" id="watch" hidden>
    <header class="watch-head">
      <strong id="watch-phase">Phase 1 of 1</strong>
      <span id="watch-who"></span>
    </header>
    <div class="stage" id="stage">
      <svg id="pitch" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rugby pitch" preserveAspectRatio="xMidYMid meet">
        <defs id="defs"></defs>
        <g id="world" transform="rotate(-90)">
          <g id="pitch-layer"></g>
          <g id="objects-layer"></g>
          <g id="routes-layer"></g>
          <g id="players-layer"></g>
          <g id="ball-routes-layer"></g>
          <g id="ball-layer"></g>
        </g>
      </svg>
      <div class="end" id="end" hidden>
        <h2 id="end-name"></h2>
        <button type="button" class="big" id="watch-again">Watch again</button>
        <button type="button" class="big secondary" id="another">Another position</button>
        <button type="button" class="big secondary" id="share">Share</button>
        <p class="end-status" id="end-status" aria-live="polite"></p>
      </div>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <nav class="controls" aria-label="Playback">
      <button type="button" id="home" aria-label="Positions">☰</button>
      <button type="button" id="back" aria-label="Previous phase">‹</button>
      <button type="button" id="toggle" class="play" aria-label="Pause">❚❚</button>
      <button type="button" id="next" aria-label="Next phase">›</button>
      <div class="speed" role="group" aria-label="Speed">
        <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
      </div>
    </nav>
  </section>
</body>
</html>
